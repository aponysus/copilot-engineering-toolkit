[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-engineering-toolkit"
version = "0.1.0.dev0"
description = "Reusable engineering instructions, agents, skills, and project templates for Copilot"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
copilot-toolkit = "copilot_engineering_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copilot_engineering_toolkit = ["catalog/*", "catalog/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ANN", "D2", "D3", "D4"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pytest>=9.2.0",
    "pyyaml>=6,<7",
    "ruff>=0.17.3",
]
