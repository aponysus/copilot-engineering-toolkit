[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-engineering-toolkit"
version = "0.1.0.dev0"
description = "Reusable engineering instructions, agents, skills, and project templates for Copilot"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
copilot-toolkit = "copilot_engineering_toolkit.cli:main"

[project.optional-dependencies]
test = ["PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copilot_engineering_toolkit = ["catalog/*", "catalog/**/*"]
